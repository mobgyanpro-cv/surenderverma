<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF3FC"/>
      <stop offset="100%" stop-color="#D9E4F5"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2F5BFF"/>
      <stop offset="100%" stop-color="#142C8A"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1B3A"/>
      <stop offset="100%" stop-color="#14254A"/>
    </linearGradient>
  </defs>
  
  <!-- Backdrop -->
  <rect width="480" height="560" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle Security & Growth Geometric Halo Rings -->
  <circle cx="240" cy="220" r="160" stroke="#2F5BFF" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="240" cy="220" r="120" stroke="#2F5BFF" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="240" cy="220" r="85" stroke="#2F5BFF" stroke-opacity="0.16" stroke-width="2"/>

  <!-- Head / Avatar Crest -->
  <circle cx="240" cy="180" r="70" fill="url(#avatarGrad)"/>
  <text x="240" y="196" text-anchor="middle" font-family="'Poppins', system-ui, -apple-system, sans-serif" font-weight="700" font-size="38" fill="#FFFFFF" letter-spacing="1">SV</text>

  <!-- Shoulders & Torso Silhouette -->
  <path d="M110 440 C110 320 370 320 370 440 L370 470 L110 470 Z" fill="url(#avatarGrad)"/>
  
  <!-- Executive Collar Line -->
  <path d="M210 340 L240 395 L270 340" stroke="#EEF3FC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Floating Executive Plaque -->
  <rect x="70" y="480" width="340" height="52" rx="14" fill="url(#badgeGrad)"/>
  <text x="240" y="504" text-anchor="middle" font-family="'Poppins', system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#FFFFFF" letter-spacing="0.5">SURENDER VERMA</text>
  <text x="240" y="522" text-anchor="middle" font-family="'Poppins', system-ui, -apple-system, sans-serif" font-weight="400" font-size="11" fill="#9AAEC7">Founder • Cyber Consultant • Career Coach</text>
</svg>
